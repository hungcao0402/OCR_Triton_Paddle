version: "3.0"

services:
  triton-server:
    build:
      args:
      - FROM_BASE_IMAGE=nvcr.io/nvidia/tritonserver:25.08-py3
      context: ./docker
      dockerfile: Dockerfile
    image: triton_server:latest
    shm_size: 16gb
    restart: always
    runtime: "nvidia"
    ports:
      - 8003:8000
      - 8001:8001
      - 8002:8002
    entrypoint:
      [
        "tritonserver",
        "--model-repository=/models",
        "--allow-metrics=true",
        "--allow-gpu-metrics=true",
        "--metrics-config", "summary_latencies=true",
      ]
    volumes:
      - type: bind
        source: model_repository
        target: /models
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  ocr-client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    image: ocr_client:latest
    restart: always
    depends_on:
      - triton-server
    environment:
      - TRITON_URL=triton-server:8001
      - TRITON_PROTOCOL=grpc
    ports:
      - 8080:8000

  prometheus:
    image: prom/prometheus:latest
    restart: always
    ports:
      - 9090:9090
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - triton-server

  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - 3000:3000
    depends_on:
      - prometheus
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json:ro
